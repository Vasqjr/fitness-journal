apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fitness-journal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: fitnessjournal
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fitness-journal-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-journal-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fj-postgres
  namespace: fitness-journal
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432